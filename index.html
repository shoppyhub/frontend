<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <!-- RKD MART Enterprise Identity -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="RKD_MART - India's Ultra-Fast Hyperlocal Shopping Ecosystem." />

    <!-- Static Assets (Public Folder) -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts: Plus Jakarta Sans (Premium SaaS Look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- 💳 Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- 📍 Mappls (MapmyIndia) SDK Integration -->
    <!-- आपकी प्रदान की गई API KEY यहाँ इंजेक्ट कर दी गई है -->
    <script src="https://apis.mappls.com/advancedmaps/api/zrkufyhpdaafvbnvvhktfnfndqbalxkdsikp/map_sdk?v=3.0&layer=vector"></script>
    <script src="https://apis.mappls.com/advancedmaps/api/zrkufyhpdaafvbnvvhktfnfndqbalxkdsikp/map_sdk?plugins=paas,interactivelayer,nearby"></script>

    <title>RKD MART | Central API Cluster</title>

    <style>
      /* Global Smooth Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body { 
        font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif; 
        background-color: #f8fafc;
        color: #1e293b;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom Scrollbar for Chrome/Safari */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #fff1f2; color: #e11d48; font-weight: bold;">
        RKD MART requires JavaScript to be enabled in your browser settings to function.
      </div>
    </noscript>
    
    <!-- React Mounting Point -->
    <div id="root"></div>

    <!-- Vite Main Entry Point -->
    <script type="module" src="/src/index.jsx"></script>
